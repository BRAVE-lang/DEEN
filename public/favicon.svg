<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with subtle rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Outer decorative Islamic border ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4" stroke-dasharray="12 6" />
  <circle cx="256" cy="256" r="206" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />
  
  <!-- Crescent Moon -->
  <path d="M 275 140 C 205 140 150 195 150 265 C 150 335 205 390 275 390 C 315 390 350 370 370 340 C 315 348 260 305 260 250 C 260 195 315 152 370 160 C 350 148 315 140 275 140 Z" 
        fill="url(#goldGrad)" filter="url(#glow)" />
  
  <!-- 8-Pointed Star -->
  <g transform="translate(330, 215) scale(0.65)">
    <!-- First square rotated 0 -->
    <rect x="-35" y="-35" width="70" height="70" fill="url(#goldGrad)" rx="6" />
    <!-- Second square rotated 45 -->
    <rect x="-35" y="-35" width="70" height="70" fill="url(#goldGrad)" rx="6" transform="rotate(45)" />
    <!-- Center gem -->
    <circle cx="0" cy="0" r="14" fill="#064e3b" />
  </g>
</svg>
